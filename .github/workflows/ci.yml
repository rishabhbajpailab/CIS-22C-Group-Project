name: CI

# Automatic runs are disabled during the proof-of-concept stage; builds are validated locally.
# To run it by hand: GitHub > Actions > CI > "Run workflow".
# To re-enable automatic runs, add `push:` and `pull_request:` under `on:`.
on:
  workflow_dispatch:

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Test
        run: ctest --test-dir build --build-config Release --output-on-failure
